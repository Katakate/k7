# Tenant: groups namespaces, API keys, dedicated nodes, a default
# sandbox size, quotas and per-VM limits. Cluster-scoped. The Helm chart ships
# an identical copy (deploy/helm/k7/crds/); a unit test keeps them equal.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.k7.katakate.org
  labels:
    app: k7-api
spec:
  group: k7.katakate.org
  scope: Cluster
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Namespaces
          type: string
          jsonPath: .spec.namespaces
        - name: Sandboxes
          type: string
          jsonPath: .status.usage.sandboxes
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [namespaces]
              properties:
                namespaces:
                  type: array
                  minItems: 1
                  items: {type: string, pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'}
                nodes:
                  type: array
                  items: {type: string, minLength: 1}
                defaultSize:
                  type: object
                  properties:
                    cpu: {x-kubernetes-int-or-string: true}
                    memory: {x-kubernetes-int-or-string: true}
                    disk: {x-kubernetes-int-or-string: true}
                quotas:
                  type: object
                  properties:
                    sandboxes: {type: integer, minimum: 0}
                    vcpu: {x-kubernetes-int-or-string: true}
                    memory: {x-kubernetes-int-or-string: true}
                    disk: {x-kubernetes-int-or-string: true}
                    snapshotStorage: {x-kubernetes-int-or-string: true}
                limits:
                  type: object
                  properties:
                    maxSandboxSize:
                      type: object
                      properties:
                        cpu: {x-kubernetes-int-or-string: true}
                        memory: {x-kubernetes-int-or-string: true}
                        disk: {x-kubernetes-int-or-string: true}
                    diskIO:
                      type: object
                      properties:
                        readBps: {x-kubernetes-int-or-string: true}
                        writeBps: {x-kubernetes-int-or-string: true}
                        readIops: {x-kubernetes-int-or-string: true}
                        writeIops: {x-kubernetes-int-or-string: true}
                    network:
                      type: object
                      properties:
                        egressBps: {x-kubernetes-int-or-string: true}
                        ingressBps: {x-kubernetes-int-or-string: true}
            status:
              type: object
              properties:
                usage:
                  type: object
                  additionalProperties: {type: string}
                observedGeneration: {type: integer}
