apiVersion: v1
kind: ServiceAccount
metadata:
  name: k7-api
  namespace: kube-system
  labels:
    app: k7-api
---
# No ClusterRoleBinding. automount is false on the DaemonSet too — root on
# an agent must not steal k7-api RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k7-agent
  namespace: kube-system
  labels:
    app: k7-agent
automountServiceAccountToken: false
