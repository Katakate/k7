apiVersion: apps/v1
kind: Deployment
metadata:
  name: k7-api
  namespace: kube-system
  labels:
    app: k7-api
spec:
  # Stateless: auth reads the k7-api-keys Secret, so replicas spread across
  # nodes (PDB minAvailable: 1). The ACME TLS overlay pins back to one
  # replica on the first master (hostPort 80 + certificate storage).
  replicas: 2
  selector:
    matchLabels:
      app: k7-api
  template:
    metadata:
      labels:
        app: k7-api
      annotations:
        k7.katakate.org/oidc-config: "__K7_OIDC_CONFIG_HASH__"
        k7.katakate.org/metering-config: "__K7_METERING_CONFIG_HASH__"
        # Annotation-based scraping; the port is reachable only from the
        # scraper selector (k7-api-metrics policies).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: k7-api
      # One replica prefers the first master: /etc/k7/api_endpoint names it,
      # and with --api-allow-cidr (externalTrafficPolicy: Local) only nodes
      # running a replica answer the NodePort. The spread keeps the other
      # replica off that node when there is more than one node.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: k7.katakate.org/first-master
                    operator: In
                    values: ["true"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: k7-api
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k7-api
          image: __K7_API_IMAGE__
          imagePullPolicy: __K7_API_IMAGE_PULL_POLICY__
          # No host access: k7d VM ops always go to the k7-agent on the
          # sandbox's node (K7_K7D_REMOTE_ONLY), so the API needs neither
          # the containerd nor the k7d socket.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: K7_LOG_FORMAT
              value: json
            - name: K7_LOG_LEVEL
              value: info
            - name: K7_METRICS_PORT
              value: "9464"
            - name: K7_API_KEY_STORE
              value: secret
            - name: K7_K7D_REMOTE_ONLY
              value: "1"
            # Production | development (k7 install --api-mode, no
            # default) and https | insecure-http; production refuses the latter.
            - name: K7_API_MODE
              value: __K7_API_MODE__
            - name: K7_API_TRANSPORT
              value: __K7_API_TRANSPORT__
            - name: K7_SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K7_EGRESS_MODE
              value: full
            - name: K7_KQL_STORAGE_CLASS
              value: longhorn
            - name: K7_KQL_SNAPSHOT_CLASS
              value: longhorn
            # POST /api/v1/install (k7.api.remote_install): off unless
            # `k7 install --api-remote-install` deployed the node-installer
            # stack; then the image it runs, pinned at deploy time.
            - name: K7_API_ENABLE_REMOTE_INSTALL
              value: "__K7_API_REMOTE_INSTALL__"
            - name: K7_NODE_INSTALLER_IMAGE
              value: "__K7_NODE_INSTALLER_IMAGE__"
            - name: K7_NODE_INSTALLER_NAMESPACE
              value: "__K7_NODE_INSTALLER_NAMESPACE__"
            # The storage sampler hands its events to the k7-agent
            # on this node; config and cluster id as on the agent.
            - name: K7_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K7_METERING_CONFIG
              value: /etc/k7-metering/config/metering.json
            - name: K7_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: k7-cluster-id
                  key: id
          envFrom:
            - configMapRef:
                name: k7-oidc
                optional: true
          volumeMounts:
            # backend + k7d_version (ConfigMap) and agent_token (Secret),
            # written by the playbook from the first master's /etc/k7.
            - name: k7-config
              mountPath: /etc/k7
              readOnly: true
            - name: metering-config
              mountPath: /etc/k7-metering/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Keep serving while the endpoint removal reaches Cilium; without
          # it a rollout drops ~200 ms of connections to the old replica.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: k7-config
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: k7-host-config
              - secret:
                  name: k7-agent-token
        - name: metering-config
          configMap:
            name: k7-metering
        - name: tmp
          emptyDir: {}
