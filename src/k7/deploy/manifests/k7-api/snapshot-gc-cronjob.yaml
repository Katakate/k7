apiVersion: batch/v1
kind: CronJob
metadata:
  name: k7-snapshot-gc
  namespace: kube-system
  labels:
    app: k7-snapshot-gc
spec:
  # Sweep every 10 minutes — matches K7Core.gc_snapshots' default keep window.
  schedule: "*/10 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: k7-snapshot-gc
        spec:
          serviceAccountName: k7-api
          restartPolicy: OnFailure
          nodeSelector:
            k7.katakate.org/first-master: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: gc
              image: __K7_API_IMAGE__
              imagePullPolicy: __K7_API_IMAGE_PULL_POLICY__
              command: ["python", "-m", "k7.api.snapshot_gc"]
              env:
                - name: K7_LOG_FORMAT
                  value: json
                - name: K7_LOG_LEVEL
                  value: info
                - name: K7_GC_KEEP_FORK_FOR_MINUTES
                  value: "10"
                - name: K7_GC_DRY_RUN
                  value: "false"
                - name: K7_SYSTEM_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: K7_KQL_STORAGE_CLASS
                  value: longhorn
                - name: K7_KQL_SNAPSHOT_CLASS
                  value: longhorn
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: "500m"
                  memory: 256Mi
