# Thin entry point over three roles (roles/):
#   k7_node_prep — host only, no kubectl; vars/<k7_distro>.yml is the adapter
#   k7_k3s       — K3s install/join/readyz (the only role that knows K3s)
#   k7_cluster   — cluster resources through the adapter's k7_kubectl
# Imports are ordered exactly as the former single play ran: K3s installs
# between host networking and the runtimes, and node-prep's containerd
# restart (first start of joining K3s nodes) precedes the readyz wait.
# Required: k7_distro (`k7 install` passes k3s). k7_node_prep_only=true runs
# node prep alone, against a node whose Kubernetes k7 does not own.
- name: Provision Bare Metal instance(s) for K7
  hosts: k7_cluster
  become: true
  vars:
    target_user: "{{ ansible_user | default('root') }}"
    # No implicit backend default — every host must set k7_backends (or inherit
    # group vars). Use k7_backends=none for a node with no sandbox runtime.
    # Every download is pinned by version AND sha256; bump both together.
    # A mismatch fails the play (no retry with a different artifact).
    snapshotter_version: "v8.4.0"
    kata_version: "3.24.0"
    kata_static_sha256: "f05bbe8e41eb19e4e735baab90c73a9d9968e83356c281a871b6452aa6b06149"
    cni_plugins_version: "v1.9.0"
    cni_plugins_sha256: "58c03705426e929658f45a851df15a86d06ef680cacbf3f2dc127731ca265c28"
    longhorn_version: "v1.10.1"
    longhorn_manifest_sha256: "9dcd2472b009e468424fc708802e4a3a0e1e0880e44add6035ec2426d312994a"
    firecracker_version: "v1.14.0"
    firecracker_sha256: "b0c60364661f396b92e350cb9d03e2e0c2140c4c24b1e48830eb7f79eb73e153"
    jailer_version: "v1.14.0"
    # K3s pin (`k7 install --k3s-version` overrides). Only used when K3s is
    # not installed yet; k7 never upgrades a running K3s.
    k3s_version: "v1.36.5+k3s1"
    # install.sh comes from this fixed tag whatever k3s_version is; it
    # verifies the k3s binary for INSTALL_K3S_VERSION against its sha256sum.
    k3s_install_sh_ref: "v1.36.5+k3s1"
    k3s_install_sh_sha256: "46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad"
    # k7d backend: release artifact source. Override
    # `k7d_artifact_local_path` (path on the Ansible controller) to install
    # from a locally built tarball instead of the GitHub release.
    k7d_version: "0.7.0"
    # From the release's SHA256SUMS. `--k7d-version` needs an entry here
    # (or `k7d_sha256=<hex>` as an extra-var); an unknown version fails.
    k7d_sha256s:
      "0.7.0": "251fd59dd219b71e0bc01338b4d0828c5d0f48861efcd91de5d831be10306f1f"
    k7d_artifact_url: "https://github.com/katakate/k7d/releases/download/v{{ k7d_version }}/k7d-v{{ k7d_version }}-x86_64-linux.tar.gz"
    k7d_artifact_local_path: ""
    # Not configurable: the k7-agent DaemonSet (manifests/k7-api/agent-daemonset.yaml)
    # carries this gid as a supplemental group on every node, including nodes
    # the k7-node-installer prepares. Node prep creates the group before k7d's
    # install.sh (which would allocate one) and fails on a different gid.
    k7d_gid: 770
    # Sparse XFS (reflink=1) loopback image backing /var/lib/k7d/disks —
    # k7d's writable volume images live there so warm forks can CoW-clone
    # them with FICLONE reflinks. Per-node override in the inventory:
    # `k7d_disks_image_size=64G`. Sizing + failure modes: docs/BACKENDS.md
    # "Disk pool sizing".
    k7d_disks_image_size: "32G"
    # Size of the LVM physical volume carved out of the spare disk for the
    # kfd kata-vg/thin-pool (the rest of the disk stays unused). Per-node
    # override in the inventory: `kata_thinpool_pv_size=400G`.
    # Docker-heavy kfd nodes share this pool with the docker graph LVs
    # (StorageClass k7-docker-lvm); raise it rather than resizing
    # silently.
    kata_thinpool_pv_size: "100G"
    # OpenEBS LVM CSI for kfd --docker block volumes. Chart +
    # driver tag are the same pin; sidecar image tags come from the chart.
    helm_version: "v3.16.4"
    helm_sha256: "fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179"
    openebs_lvm_localpv_version: "1.10.1"
    openebs_lvm_driver_image: "docker.io/openebs/lvm-driver:1.10.1"
    # CNI: "cilium" (default) enables FQDN egress via CiliumNetworkPolicy.
    # "flannel" retains K3s's bundled CNI (CIDR-only egress).
    k7_cni_default: "cilium"
    cilium_cli_version: "v0.19.2"
    cilium_cli_sha256: "aa25cd2542614051573008ed18adb7d697fd78e4b0345db83d1650cdaf4492de"
    cilium_version: "1.19.2"
    # Hubble CLI is a separate repo from Cilium; the 1.19 line skipped
    # v1.19.2 (no such tag). Pin v1.19.3, which vendors Cilium 1.19.2+.
    hubble_cli_version: "v1.19.3"
    hubble_cli_sha256: "e0e555001a46921ff2501ddc874ed1f4c68ba20cdb00cf4ea8263be4395eb008"
    # Must be 2^n - 1 and <= 65535. Default is 4095; 2047 is the
    # conservative observe buffer (nodes also run Kata + Longhorn + k3s).
    hubble_event_buffer_capacity: "2047"
    # k7-api TLS. Default is HTTPS + playbook CA. The CLI
    # forwards these extra-vars; empty / false keeps the documented
    # defaults when the playbook is invoked directly.
    k7_api_insecure_http: false
    k7_api_hostname: ""
    k7_api_tls_cert_src: ""
    k7_api_tls_key_src: ""
    k7_api_acme_staging: false
    # `k7 install --monitoring`: the pinned kube-prometheus-stack
    # (Prometheus v3.15.0, the promtool CI tests the rules with), whose
    # Prometheus pods are the /metrics scraper.
    k7_monitoring: false
    # Pods allowed into port 9464; empty admits none (`--metrics-scraper`).
    k7_metrics_scraper: ""
    k7_monitoring_scraper: "monitoring:app.kubernetes.io/name=prometheus"
    kube_prometheus_stack_version: "92.3.0"
    kube_prometheus_stack_sha256: "48399b911fa91b353e0c3d5e32c1cb7a67a168566549723553154ffd7be5d1fa"
    # How long k7-api trusts a cached OIDC JWKS. Matches
    # k7.api.oidc.JWKS_TTL_SECONDS; minimum is oidc.REFRESH_SECONDS (10).
    k7_oidc_jwks_ttl_seconds: 3600
    # k7-api image: `local` (build k7-api:local from `k7_repo_root`, unsigned)
    # or name@sha256:<digest> (pulled by every node's containerd). The CLI
    # passes the digest from the packaged images.lock.yaml; no default.
    k7_api_image: ""
    # POST /api/v1/install (off by default): deploys the k7-node-installer
    # stack in k7-system and lets cluster-wide admins label nodes into its
    # pool. The image is `local` or name@sha256:<digest>, like k7_api_image;
    # the installer config is this play's distro, backends and disk settings.
    k7_api_remote_install: false
    k7_node_installer_image: ""
    k7_node_installer_allow_server_restart: false
    # Packaged k7/deploy dir on the controller (manifests, k7d-fc, TLS
    # renderer). The CLI passes it; direct runs use the playbook's dir.
    k7_deploy_dir: "{{ playbook_dir }}"
    # Host Docker exists only to build `--api-image local` /
    # `--node-installer-image local` on the first master. Docker's apt repo keeps old versions, so the pin stays valid.
    docker_apt_key_sha256: "1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570"
    docker_ce_version: "5:29.8.2-1~ubuntu.24.04~noble"
    docker_containerd_version: "2.3.6-1~ubuntu.24.04~noble"
    docker_buildx_version: "0.37.1-1~ubuntu.24.04~noble"
    # Map ansible_architecture to Debian/Kata arch format
    arch_map:
      x86_64: amd64
      aarch64: arm64
    deb_arch: "{{ arch_map[ansible_architecture] | default(ansible_architecture) }}"


  tasks:
    - name: Node prep — shared variable contract and distro adapter
      ansible.builtin.import_role:
        name: k7_node_prep
        tasks_from: facts

    - name: Cluster — validate cluster and API options before touching the host
      ansible.builtin.import_role:
        name: k7_cluster
        tasks_from: validate
      when: not (k7_node_prep_only | default(false) | bool)

    - name: K3s — validate k7_dns_upstreams before touching the host
      ansible.builtin.import_role:
        name: k7_k3s
        tasks_from: dns_validate
      when: not (k7_node_prep_only | default(false) | bool)

    - name: Node prep — host packages, KVM, iptables, CNI plugins
      ansible.builtin.import_role:
        name: k7_node_prep
        tasks_from: host

    - name: K3s — host prep before the first K3s start
      ansible.builtin.import_role:
        name: k7_k3s
        tasks_from: prep
      when: not (k7_node_prep_only | default(false) | bool)

    - name: Node prep — host networking and Docker
      ansible.builtin.import_role:
        name: k7_node_prep
        tasks_from: network

    - name: K3s — install / join
      ansible.builtin.import_role:
        name: k7_k3s
        tasks_from: install
      when: not (k7_node_prep_only | default(false) | bool)

    - name: Node prep — Firecracker, Kata and the VMM reaper
      ansible.builtin.import_role:
        name: k7_node_prep
        tasks_from: runtimes

    # first-boot: per-node disk state; a Packer bake skips it.
    - name: Node prep — kfd LVM thin pool
      ansible.builtin.import_role:
        name: k7_node_prep
        tasks_from: disks
      tags: ['first-boot']

    - name: Node prep — k7d and k7d-fc
      ansible.builtin.import_role:
        name: k7_node_prep
        tasks_from: k7d

    - name: Node prep — node config, containerd runtime handlers, containerd restart
      ansible.builtin.import_role:
        name: k7_node_prep
        tasks_from: containerd

    - name: K3s — wait for the apiserver
      ansible.builtin.import_role:
        name: k7_k3s
        tasks_from: ready
      when: not (k7_node_prep_only | default(false) | bool)

    - name: Cluster — Cilium, RuntimeClasses, labels, Longhorn, OpenEBS, k7-api
      ansible.builtin.import_role:
        name: k7_cluster
        tasks_from: resources
      when: not (k7_node_prep_only | default(false) | bool)
