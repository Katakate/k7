---
# ------------------------------------------------------------------
# Cilium CNI install (cluster-wide, delegated to first master)
# Runs BEFORE node-Ready gate because nodes stay NotReady until a CNI
# is installed when k3s is launched with --flannel-backend=none.
# ------------------------------------------------------------------
- name: Check if cilium CLI is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/cilium
  register: cilium_cli_stat
  when: k7_cni_is_cilium
  tags: ['cilium']

- name: Download Cilium CLI tarball
  ansible.builtin.get_url:
    url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ deb_arch }}.tar.gz"
    dest: /tmp/cilium-cli.tar.gz
    checksum: "sha256:{{ cilium_cli_sha256 }}"
    mode: '0644'
    timeout: 60
  register: cilium_cli_dl
  retries: 5
  delay: 10
  until: cilium_cli_dl is success
  when:
    - k7_cni_is_cilium
    - not cilium_cli_stat.stat.exists
  tags: ['cilium']

- name: Extract Cilium CLI
  ansible.builtin.unarchive:
    src: /tmp/cilium-cli.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ['cilium']
  when:
    - k7_cni_is_cilium
    - not cilium_cli_stat.stat.exists
  tags: ['cilium']

- name: Ensure cilium CLI is executable
  ansible.builtin.file:
    path: /usr/local/bin/cilium
    mode: '0755'
  when: k7_cni_is_cilium
  tags: ['cilium']

- name: Check if Hubble CLI is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/hubble
  register: hubble_cli_stat
  when:
    - k7_cni_is_cilium
    - k7_hubble_enabled | default(false) | bool
  tags: ['cilium', 'hubble']

- name: Download Hubble CLI tarball
  ansible.builtin.get_url:
    url: "https://github.com/cilium/hubble/releases/download/{{ hubble_cli_version }}/hubble-linux-{{ deb_arch }}.tar.gz"
    dest: /tmp/hubble-cli.tar.gz
    checksum: "sha256:{{ hubble_cli_sha256 }}"
    mode: '0644'
    timeout: 60
  register: hubble_cli_dl
  retries: 5
  delay: 10
  until: hubble_cli_dl is success
  when:
    - k7_cni_is_cilium
    - k7_hubble_enabled | default(false) | bool
    - not hubble_cli_stat.stat.exists
  tags: ['cilium', 'hubble']

- name: Extract Hubble CLI
  ansible.builtin.unarchive:
    src: /tmp/hubble-cli.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ['hubble']
  when:
    - k7_cni_is_cilium
    - k7_hubble_enabled | default(false) | bool
    - not hubble_cli_stat.stat.exists
  tags: ['cilium', 'hubble']

- name: Ensure Hubble CLI is executable
  ansible.builtin.file:
    path: /usr/local/bin/hubble
    mode: '0755'
  when:
    - k7_cni_is_cilium
    - k7_hubble_enabled | default(false) | bool
  tags: ['cilium', 'hubble']

# Present / absent / unknown. A busy apiserver is unknown
# (retry, then fail loud), never "not installed" — that used to start
# `cilium install` on a cluster that already had Cilium.
# Keep in sync with src/k7/deploy/k8s-object-presence.sh.
- name: Classify Cilium DaemonSet presence
  ansible.builtin.shell: |
    set -eu
    retries=5
    delay=5
    attempt=1
    while [ "$attempt" -le "$retries" ]; do
      set +e
      out=$({{ k7_kubectl }} -n kube-system get daemonset cilium 2>&1)
      rc=$?
      set -e
      if [ "$rc" -eq 0 ]; then
        echo present
        exit 0
      fi
      if printf '%s' "$out" | grep -qiE 'notfound|not found'; then
        echo absent
        exit 0
      fi
      echo "kubectl error (attempt ${attempt}/${retries}): $out" >&2
      if [ "$attempt" -eq "$retries" ]; then
        echo unknown >&2
        exit 2
      fi
      sleep "$delay"
      attempt=$((attempt + 1))
    done
    exit 2
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ k7_kubeconfig }}"
  register: cilium_presence
  failed_when: cilium_presence.rc == 2
  changed_when: false
  run_once: true
  delegate_to: "{{ k7_first_master }}"
  when: k7_cni_is_cilium
  tags: ['cilium']

# Cilium tuning notes:
# - MTU=1450: VXLAN adds 50B overhead. Cilium's auto-detect can leave
#   pods at the underlying NIC MTU (1500), which breaks HTTPS through
#   the encap. Pinning pod MTU to 1450 fixes this for both standard
#   and Kata pods.
# - socketLB.hostNamespaceOnly=true: required for Kata-Containers
#   compatibility (Cilium docs:
#   https://docs.cilium.io/en/stable/network/kubernetes/kata/). With
#   kubeProxyReplacement=true the socket-LB is normally used for
#   ClusterIP routing, but Kata VMs run their sockets in a separate
#   netns the host-cgroup BPF can't intercept, so service traffic
#   (including kube-dns) stalls. Limiting socket-LB to the host
#   namespace forces pod traffic onto the per-packet LB path which
#   works for Kata.
# - dnsProxy.minTtl=3600: CDN-backed hosts (CloudFront et al.) return
#   DNS TTLs of 30-60s, but clients like dockerd cache the resolved IP
#   and keep dialing it for minutes across retries. With minTtl=0 the
#   FQDN→identity mapping expires with the upstream TTL and every
#   later SYN is policy-dropped. Keep learned IPs
#   allowed for 1h after the lookup.
# - dnsProxy.dnsRejectResponseCode=nameError: an FQDN sandbox's DNS rule
#   allows only its allowlisted names, so with ndots:5 every lookup is
#   first denied as `<name>.<ns>.svc.cluster.local` and so on. musl
#   (Alpine) aborts the search list on the default REFUSED; NXDOMAIN lets
#   every libc move on to the next candidate.
- name: Install Cilium (kube-proxy replacement, FQDN support)  # noqa: no-changed-when
  ansible.builtin.shell: |
    set -eu
    export KUBECONFIG={{ k7_kubeconfig }}
    /usr/local/bin/cilium install \
      --version {{ cilium_version }} \
      --set kubeProxyReplacement=true \
      --set k8sServiceHost={{ hostvars[k7_first_master]['ansible_host'] | default(k7_first_master) }} \
      --set k8sServicePort=6443 \
      --set ipam.mode=kubernetes \
      --set operator.replicas=1 \
      --set MTU=1450 \
      --set socketLB.hostNamespaceOnly=true \
      --set dnsProxy.minTtl=3600 \
      --set dnsProxy.dnsRejectResponseCode=nameError{% if k7_hubble_enabled | default(false) | bool %} \
      --set hubble.enabled=true \
      --set hubble.relay.enabled=true \
      --set hubble.ui.enabled=false \
      --set hubble.eventBufferCapacity={{ hubble_event_buffer_capacity }}{% endif %}
  args:
    executable: /bin/bash
  run_once: true
  delegate_to: "{{ k7_first_master }}"
  when:
    - k7_cni_is_cilium
    - cilium_presence.stdout == "absent"
  tags: ['cilium']

# Clusters installed before dnsRejectResponseCode was set skip the install
# task above. Set it through Helm (a `cilium config set` would be reverted
# by the next `cilium hubble enable` / upgrade), keeping the running Cilium
# version and every other value (cilium-cli --reset-then-reuse-values,
# its default). The chart does not roll the agents on a ConfigMap change.
- name: Read Cilium DNS proxy reject code
  ansible.builtin.command: >-
    {{ k7_kubectl }} -n kube-system get configmap cilium-config
    -o jsonpath={.data.tofqdns-dns-reject-response-code}
  environment:
    KUBECONFIG: "{{ k7_kubeconfig }}"
  register: cilium_dns_reject
  changed_when: false
  run_once: true
  delegate_to: "{{ k7_first_master }}"
  when:
    - k7_cni_is_cilium
    - cilium_presence.stdout == "present"
  tags: ['cilium']

- name: Set Cilium DNS proxy reject code to NXDOMAIN (existing install)
  ansible.builtin.shell: |
    set -eu
    export KUBECONFIG={{ k7_kubeconfig }}
    image=$({{ k7_kubectl }} -n kube-system get ds cilium -o jsonpath='{.spec.template.spec.containers[0].image}')
    version=$(printf '%s' "$image" | sed -nE 's/^[^@]*:v([0-9]+\.[0-9]+\.[0-9]+)(@.*)?$/\1/p')
    if [ -z "$version" ]; then
      echo "cannot read the running Cilium version from image '$image'" >&2
      exit 1
    fi
    /usr/local/bin/cilium upgrade --version "$version" --set dnsProxy.dnsRejectResponseCode=nameError
    got=$({{ k7_kubectl }} -n kube-system get configmap cilium-config -o jsonpath='{.data.tofqdns-dns-reject-response-code}')
    if [ "$got" != "nameError" ]; then
      echo "cilium upgrade left tofqdns-dns-reject-response-code='$got'" >&2
      exit 1
    fi
    {{ k7_kubectl }} -n kube-system rollout restart ds/cilium
    {{ k7_kubectl }} -n kube-system rollout status ds/cilium --timeout=600s
  args:
    executable: /bin/bash
  changed_when: true
  run_once: true
  delegate_to: "{{ k7_first_master }}"
  when:
    - k7_cni_is_cilium
    - cilium_presence.stdout == "present"
    - cilium_dns_reject.stdout != "nameError"
  tags: ['cilium']

# cilium install is skipped when the DaemonSet already exists, so
# --set hubble.* on that command is a no-op on every re-run. Enable
# Hubble on existing clusters with a separate, idempotent task.
# `cilium hubble enable` Helm-upgrades the Cilium release and
# restarts the agent DaemonSet — do not run as a side effect of an
# unrelated `k7 install` (gated on --hubble).
# Same three-state split as the Cilium DaemonSet check. A blipped
# `kubectl get` must not fall through to `cilium hubble enable`
# (Helm-upgrade + agent restart).
- name: Classify Hubble relay presence
  ansible.builtin.shell: |
    set -eu
    retries=5
    delay=5
    attempt=1
    while [ "$attempt" -le "$retries" ]; do
      set +e
      out=$({{ k7_kubectl }} -n kube-system get deployment hubble-relay 2>&1)
      rc=$?
      set -e
      if [ "$rc" -eq 0 ]; then
        echo present
        exit 0
      fi
      if printf '%s' "$out" | grep -qiE 'notfound|not found'; then
        echo absent
        exit 0
      fi
      echo "kubectl error (attempt ${attempt}/${retries}): $out" >&2
      if [ "$attempt" -eq "$retries" ]; then
        echo unknown >&2
        exit 2
      fi
      sleep "$delay"
      attempt=$((attempt + 1))
    done
    exit 2
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ k7_kubeconfig }}"
  register: hubble_presence
  failed_when: hubble_presence.rc == 2
  changed_when: false
  run_once: true
  delegate_to: "{{ k7_first_master }}"
  when:
    - k7_cni_is_cilium
    - k7_hubble_enabled | default(false) | bool
  tags: ['cilium', 'hubble']

- name: Enable Hubble
  ansible.builtin.shell: |
    set -eu
    export KUBECONFIG={{ k7_kubeconfig }}
    # cilium-cli v0.19.2 only accepts --relay/--ui here (no --helm-set).
    # Relay is on by default; do not pass --ui (no auth, public node IP).
    /usr/local/bin/cilium hubble enable
  args:
    executable: /bin/bash
  register: hubble_enable
  changed_when: true
  run_once: true
  delegate_to: "{{ k7_first_master }}"
  when:
    - k7_cni_is_cilium
    - k7_hubble_enabled | default(false) | bool
    - hubble_presence.stdout == "absent"
  tags: ['cilium', 'hubble']

- name: Wait for Hubble relay to be Ready  # noqa: no-changed-when
  ansible.builtin.command: "{{ k7_kubectl }} -n kube-system rollout status deployment/hubble-relay --timeout=300s"
  environment:
    KUBECONFIG: "{{ k7_kubeconfig }}"
  run_once: true
  delegate_to: "{{ k7_first_master }}"
  when:
    - k7_cni_is_cilium
    - k7_hubble_enabled | default(false) | bool
  tags: ['cilium', 'hubble']

# First install: the DaemonSet just appeared. Full --wait is the right gate.
- name: Wait for Cilium to report ready (first install)  # noqa: no-changed-when
  ansible.builtin.command: /usr/local/bin/cilium status --wait --wait-duration 5m
  environment:
    KUBECONFIG: "{{ k7_kubeconfig }}"
  run_once: true
  delegate_to: "{{ k7_first_master }}"
  when:
    - k7_cni_is_cilium
    - cilium_presence.stdout == "absent"
  tags: ['cilium']

# Reinstall: do not fail the play because `cilium status` printed
# warnings while the DaemonSet is Ready (a measured flake).
# Fail loud only if the agent is actually not Ready.
- name: Confirm Cilium agent is Ready (reinstall)  # noqa: command-instead-of-shell no-changed-when
  ansible.builtin.shell: |
    set -eu
    export KUBECONFIG={{ k7_kubeconfig }}
    ds_ready() {
      ready=$({{ k7_kubectl }} -n kube-system get ds cilium -o jsonpath='{.status.numberReady}')
      desired=$({{ k7_kubectl }} -n kube-system get ds cilium -o jsonpath='{.status.desiredNumberScheduled}')
      [ -n "$ready" ] && [ -n "$desired" ] && [ "$desired" != "0" ] && [ "$ready" = "$desired" ]
    }
    if ds_ready; then
      echo "Cilium DaemonSet Ready; cilium status warnings are not a failure"
      /usr/local/bin/cilium status || true
      exit 0
    fi
    i=1
    while [ "$i" -le 3 ]; do
      /usr/local/bin/cilium status --wait --wait-duration 1m || true
      if ds_ready; then
        echo "Cilium DaemonSet Ready after wait ${i}"
        exit 0
      fi
      i=$((i + 1))
    done
    echo "Cilium agent not Ready after 3m" >&2
    /usr/local/bin/cilium status || true
    {{ k7_kubectl }} -n kube-system get ds cilium || true
    exit 1
  args:
    executable: /bin/bash
  run_once: true
  delegate_to: "{{ k7_first_master }}"
  when:
    - k7_cni_is_cilium
    - cilium_presence.stdout == "present"
  tags: ['cilium']
